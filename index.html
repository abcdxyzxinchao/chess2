<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cờ Tướng Online Chuẩn</title>

<style>

body{
margin:0;
background:#1f2125;
font-family:Arial;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
min-height:100vh;
color:white;
overflow:hidden;
}

#menu{
width:95%;
max-width:420px;
background:#2b2d31;
padding:20px;
border-radius:12px;
text-align:center;
}

input{
width:90%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
font-size:16px;
}

button{
border:none;
padding:12px;
border-radius:8px;
margin-top:10px;
cursor:pointer;
font-weight:bold;
}

#createBtn{
background:#2ecc71;
color:white;
width:100%;
}

#joinBtn{
background:#3498db;
color:white;
width:100%;
}

#status{
margin-top:15px;
color:#f1c40f;
}

#boardContainer{
display:none;
margin-top:10px;
position:relative;
}

#board{
position:relative;
width:540px;
height:600px;
background:#f5deb3;
border:4px solid #8b4513;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.line{
position:absolute;
background:#000;
}

#river{
position:absolute;
top:270px;
left:0;
width:100%;
height:60px;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-weight:bold;
color:#8b4513;
letter-spacing:10px;
}

.piece{
width:48px;
height:48px;
border-radius:50%;
position:absolute;
background:#f9d976;
border:2px solid #8b4513;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
cursor:pointer;
z-index:5;
transition:0.15s;
user-select:none;
}

.red{
color:#d63031;
}

.black{
color:#111;
}

.selected{
transform:scale(1.1);
box-shadow:0 0 15px #00ff00;
}

.move-dot{
position:absolute;
width:16px;
height:16px;
background:#2ecc71;
border-radius:50%;
z-index:2;
pointer-events:none;
}

#gameInfo{
display:none;
margin-top:15px;
text-align:center;
}

#turn{
font-size:20px;
margin-bottom:10px;
}

#autoBtn{
background:#9b59b6;
color:white;
}

#autoBtn.active{
background:#2ecc71;
}

</style>
</head>

<body>

<div id="menu">

<h2>♟️ Cờ Tướng Online</h2>

<button id="createBtn">➕ Tạo phòng</button>

<input id="roomInput" placeholder="Nhập mã phòng">

<button id="joinBtn">🔗 Vào phòng</button>

<div id="status">Chưa kết nối</div>

</div>

<div id="boardContainer">

<div id="board">

<div id="river">楚 河　　　　漢 界</div>

</div>

</div>

<div id="gameInfo">

<div id="turn"></div>

<button id="autoBtn">🤖 AI: TẮT</button>

</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>

const CELL = 60;

const piecesMap = {

r:"車",
h:"馬",
e:"象",
a:"士",
k:"將",
c:"炮",
p:"卒",

R:"車",
H:"馬",
E:"相",
A:"仕",
K:"帥",
C:"炮",
P:"兵"

};

let peer;
let conn;

let mySide = null;

let autoAI = false;

let selected = null;

let turn = "red";

let board = [];

function initBoard(){

board = [

["r","h","e","a","k","a","e","h","r"],
["","","","","","","","",""],
["","c","","","","","","c",""],
["p","","p","","p","","p","","p"],
["","","","","","","","",""],

["","","","","","","","",""],

["P","","P","","P","","P","","P"],
["","C","","","","","","C",""],
["","","","","","","","",""],
["R","H","E","A","K","A","E","H","R"]

];

}

function drawBoard(){

const boardDiv = document.getElementById("board");

boardDiv.innerHTML = `
<div id="river">楚 河　　　　漢 界</div>
`;

for(let r=0;r<10;r++){

let line = document.createElement("div");

line.className = "line";

line.style.left = "30px";
line.style.top = (30 + r*60) + "px";
line.style.width = "480px";
line.style.height = "2px";

boardDiv.appendChild(line);

}

for(let c=0;c<9;c++){

if(c===0 || c===8){

let line = document.createElement("div");

line.className = "line";

line.style.left = (30 + c*60) + "px";
line.style.top = "30px";
line.style.width = "2px";
line.style.height = "540px";

boardDiv.appendChild(line);

}else{

let top = document.createElement("div");

top.className = "line";

top.style.left = (30 + c*60) + "px";
top.style.top = "30px";
top.style.width = "2px";
top.style.height = "240px";

boardDiv.appendChild(top);

let bottom = document.createElement("div");

bottom.className = "line";

bottom.style.left = (30 + c*60) + "px";
bottom.style.top = "330px";
bottom.style.width = "2px";
bottom.style.height = "240px";

boardDiv.appendChild(bottom);

}

}

drawPalace(3,0);
drawPalace(3,7);

for(let r=0;r<10;r++){

for(let c=0;c<9;c++){

let point = document.createElement("div");

point.style.position = "absolute";

point.style.left =
(30 + c*60 - 25) + "px";

point.style.top =
(30 + r*60 - 25) + "px";

point.style.width = "50px";
point.style.height = "50px";

point.style.zIndex = "1";

point.style.cursor = "pointer";

point.onclick = ()=>clickCell(r,c);

boardDiv.appendChild(point);

}

}

}

function drawPalace(col,row){

const boardDiv = document.getElementById("board");

function diagonal(x1,y1,x2,y2){

let line = document.createElement("div");

line.className = "line";

let len = Math.sqrt(
Math.pow(x2-x1,2)+
Math.pow(y2-y1,2)
);

line.style.width = len + "px";
line.style.height = "2px";

line.style.left = x1 + "px";
line.style.top = y1 + "px";

let angle =
Math.atan2(
y2-y1,
x2-x1
) * 180 / Math.PI;

line.style.transform =
`rotate(${angle}deg)`;

line.style.transformOrigin = "0 0";

boardDiv.appendChild(line);

}

diagonal(
30 + col*60,
30 + row*60,
30 + (col+2)*60,
30 + (row+2)*60
);

diagonal(
30 + (col+2)*60,
30 + row*60,
30 + col*60,
30 + (row+2)*60
);

}

function renderPieces(){

document.querySelectorAll(".piece")
.forEach(e=>e.remove());

document.querySelectorAll(".move-dot")
.forEach(e=>e.remove());

const boardDiv =
document.getElementById("board");

for(let r=0;r<10;r++){

for(let c=0;c<9;c++){

const piece = board[r][c];

if(piece){

const div =
document.createElement("div");

div.className = "piece";

if(piece === piece.toUpperCase()){

div.classList.add("red");

}else{

div.classList.add("black");

}

if(
selected &&
selected.r===r &&
selected.c===c
){

div.classList.add("selected");

}

div.innerHTML = piecesMap[piece];

div.style.left =
(30 + c*60 - 24) + "px";

div.style.top =
(30 + r*60 - 24) + "px";

div.onclick = (e)=>{

e.stopPropagation();

clickPiece(r,c);

};

boardDiv.appendChild(div);

}

}

}

if(selected){

for(let r=0;r<10;r++){

for(let c=0;c<9;c++){

if(
isValidMove(
selected.r,
selected.c,
r,
c
)
){

let dot =
document.createElement("div");

dot.className = "move-dot";

dot.style.left =
(30 + c*60 - 8) + "px";

dot.style.top =
(30 + r*60 - 8) + "px";

boardDiv.appendChild(dot);

}

}

}

}

}

function clickPiece(r,c){

if(!isMyTurn()) return;

const piece = board[r][c];

if(selected){

if(
isValidMove(
selected.r,
selected.c,
r,
c
)
){

movePiece(
selected.r,
selected.c,
r,
c
);

selected = null;

renderPieces();

syncGame();

switchTurn();

checkWinner();

setTimeout(()=>{
aiMove();
},200);

return;

}

}

if(piece){

if(
(turn==="red" && piece===piece.toUpperCase()) ||

(turn==="black" && piece===piece.toLowerCase())
){

selected = {r,c};

renderPieces();

}

}

}

function clickCell(r,c){

if(!selected) return;

if(
isValidMove(
selected.r,
selected.c,
r,
c
)
){

movePiece(
selected.r,
selected.c,
r,
c
);

selected = null;

renderPieces();

syncGame();

switchTurn();

checkWinner();

setTimeout(()=>{
aiMove();
},200);

}else{

selected = null;

renderPieces();

}

}

function movePiece(sr,sc,tr,tc){

board[tr][tc] = board[sr][sc];

board[sr][sc] = "";

}

function isInside(r,c){

return r>=0 && r<10 &&
c>=0 && c<9;

}

function isRed(piece){

return piece &&
piece===piece.toUpperCase();

}

function isMyTurn(){

return (
(mySide==="red" && turn==="red") ||
(mySide==="black" && turn==="black")
);

}

function switchTurn(){

turn =
turn==="red"
? "black"
: "red";

updateTurn();

}

function updateTurn(){

document.getElementById("turn")
.innerHTML =
isMyTurn()
? "👉 Lượt của bạn"
: "⏳ Đợi đối thủ";

}

function clearPath(sr,sc,tr,tc){

let count = 0;

if(sr===tr){

let step = tc>sc ? 1 : -1;

for(let c=sc+step;c!==tc;c+=step){

if(board[sr][c]!=="")
count++;

}

}else{

let step = tr>sr ? 1 : -1;

for(let r=sr+step;r!==tr;r+=step){

if(board[r][sc]!=="")
count++;

}

}

return count;

}

function isValidMove(sr,sc,tr,tc){

if(!isInside(tr,tc))
return false;

const piece = board[sr][sc];

if(!piece) return false;

const target = board[tr][tc];

if(target){

if(isRed(piece)===isRed(target))
return false;

}

const dr = tr-sr;
const dc = tc-sc;

switch(piece.toLowerCase()){

case "r":

if(sr!==tr && sc!==tc)
return false;

return clearPath(sr,sc,tr,tc)===0;

case "h":

if(
Math.abs(dr)===2 &&
Math.abs(dc)===1
){

let leg =
sr + dr/2;

if(board[leg][sc]!=="")
return false;

return true;

}

if(
Math.abs(dr)===1 &&
Math.abs(dc)===2
){

let leg =
sc + dc/2;

if(board[sr][leg]!=="")
return false;

return true;

}

return false;

case "e":

if(
Math.abs(dr)!==2 ||
Math.abs(dc)!==2
)
return false;

let eyeR =
sr + dr/2;

let eyeC =
sc + dc/2;

if(board[eyeR][eyeC]!=="")
return false;

if(isRed(piece) && tr<5)
return false;

if(!isRed(piece) && tr>4)
return false;

return true;

case "a":

if(
Math.abs(dr)!==1 ||
Math.abs(dc)!==1
)
return false;

if(isRed(piece)){

return tr>=7 &&
tc>=3 &&
tc<=5;

}else{

return tr<=2 &&
tc>=3 &&
tc<=5;

}

case "k":

if(Math.abs(dr)+Math.abs(dc)!==1)
return false;

if(isRed(piece)){

return tr>=7 &&
tc>=3 &&
tc<=5;

}else{

return tr<=2 &&
tc>=3 &&
tc<=5;

}

case "c":

if(sr!==tr && sc!==tc)
return false;

let between =
clearPath(sr,sc,tr,tc);

if(target===""){

return between===0;

}else{

return between===1;

}

case "p":

if(isRed(piece)){

if(sr<=4){

if(
(dr===-1 && dc===0) ||
(dr===0 && Math.abs(dc)===1)
)
return true;

}else{

if(dr===-1 && dc===0)
return true;

}

}else{

if(sr>=5){

if(
(dr===1 && dc===0) ||
(dr===0 && Math.abs(dc)===1)
)
return true;

}else{

if(dr===1 && dc===0)
return true;

}

}

return false;

}

return false;

}

function syncGame(){

if(conn && conn.open){

conn.send({
board,
turn
});

}

}

function evaluateBoard(){

const values = {

k:10000,
r:900,
c:500,
h:400,
e:200,
a:200,
p:100

};

let score = 0;

for(let r=0;r<10;r++){

for(let c=0;c<9;c++){

const piece = board[r][c];

if(piece){

let val =
values[piece.toLowerCase()] || 0;

if(isRed(piece)){

score += val;

}else{

score -= val;

}

}

}

}

return turn==="red"
? score
: -score;

}

function getAllMoves(side){

let moves = [];

for(let r=0;r<10;r++){

for(let c=0;c<9;c++){

const piece = board[r][c];

if(!piece) continue;

if(side==="red" && !isRed(piece))
continue;

if(side==="black" && isRed(piece))
continue;

for(let tr=0;tr<10;tr++){

for(let tc=0;tc<9;tc++){

if(
isValidMove(r,c,tr,tc)
){

moves.push({
sr:r,
sc:c,
tr,
tc
});

}

}

}

}

}

return moves;

}

function aiMove(){

if(!autoAI) return;

if(!isMyTurn()) return;

let bestScore = -999999;

let bestMove = null;

const moves =
getAllMoves(turn);

for(let move of moves){

const backup =
board[move.tr][move.tc];

board[move.tr][move.tc] =
board[move.sr][move.sc];

board[move.sr][move.sc] = "";

let score =
evaluateBoard();

board[move.sr][move.sc] =
board[move.tr][move.tc];

board[move.tr][move.tc] =
backup;

if(score > bestScore){

bestScore = score;

bestMove = move;

}

}

if(bestMove){

setTimeout(()=>{

movePiece(
bestMove.sr,
bestMove.sc,
bestMove.tr,
bestMove.tc
);

renderPieces();

syncGame();

switchTurn();

checkWinner();

},400);

}

}

function checkWinner(){

let redKing = false;
let blackKing = false;

for(let r=0;r<10;r++){

for(let c=0;c<9;c++){

if(board[r][c]==="K")
redKing = true;

if(board[r][c]==="k")
blackKing = true;

}

}

if(!redKing){

alert("⚫ Đen thắng");

location.reload();

}

if(!blackKing){

alert("🔴 Đỏ thắng");

location.reload();

}

}

function createRoom(){

const roomId =
Math.floor(
10000 + Math.random()*90000
).toString();

peer = new Peer(roomId);

mySide = "red";

peer.on("open",(id)=>{

document.getElementById("status")
.innerHTML =
`🎟️ Mã phòng:
<b style="font-size:24px;color:#2ecc71">
${id}
</b>`;

});

peer.on("connection",(connection)=>{

conn = connection;

setupConnection();

startGame();

});

}

function joinRoom(id){

peer = new Peer();

mySide = "black";

peer.on("open",()=>{

conn = peer.connect(id);

setupConnection();

});

}

function setupConnection(){

conn.on("open",()=>{

document.getElementById("status")
.innerHTML = "✅ Đã kết nối";

startGame();

});

conn.on("data",(data)=>{

board = data.board;

turn = data.turn;

renderPieces();

updateTurn();

setTimeout(()=>{
aiMove();
},200);

});

conn.on("close",()=>{

alert("Đối thủ thoát");

location.reload();

});

}

function startGame(){

document.getElementById("menu")
.style.display = "none";

document.getElementById("boardContainer")
.style.display = "block";

document.getElementById("gameInfo")
.style.display = "block";

drawBoard();

renderPieces();

updateTurn();

setTimeout(()=>{
aiMove();
},300);

}

document.getElementById("createBtn")
.onclick = ()=>createRoom();

document.getElementById("joinBtn")
.onclick = ()=>{

const id =
document.getElementById("roomInput")
.value.trim();

if(id){

joinRoom(id);

}

};

document.getElementById("autoBtn")
.onclick = function(){

autoAI = !autoAI;

if(autoAI){

this.classList.add("active");

this.innerHTML = "🤖 AI: BẬT";

setTimeout(()=>{
aiMove();
},300);

}else{

this.classList.remove("active");

this.innerHTML = "🤖 AI: TẮT";

}

};

initBoard();

</script>

</body>
</html>
