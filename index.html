<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cờ Vua Online P2P</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"/>

<style>
body{
    margin:0;
    background:#1e1f22;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

#menu{
    width:95%;
    max-width:400px;
    background:#2b2d31;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

input{
    width:90%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    font-size:16px;
}

button{
    border:none;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
}

#createBtn{
    background:#2ecc71;
    color:white;
    width:100%;
}

#joinBtn{
    background:#3498db;
    color:white;
    width:100%;
}

#status{
    margin-top:15px;
    font-size:14px;
    color:#f1c40f;
}

#board{
    width:95vw;
    max-width:500px;
    display:none;
}

#gameInfo{
    margin-top:15px;
    display:none;
    text-align:center;
}

#turn{
    font-size:18px;
    margin-bottom:10px;
}

#autoBtn{
    background:#9b59b6;
    color:white;
    width:200px;
}

#autoBtn.active{
    background:#2ecc71;
}

#history{
    margin-top:20px;
    text-align:left;
}

.historyItem{
    background:#3a3d42;
    padding:8px;
    border-radius:6px;
    margin-top:5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
</style>
</head>

<body>

<div id="menu">
    <h2>♟️ Cờ Vua Online</h2>

    <button id="createBtn">➕ Tạo phòng</button>

    <input id="roomInput" placeholder="Nhập mã phòng">

    <button id="joinBtn">🔗 Vào phòng</button>

    <div id="status">Chưa kết nối</div>

    <div id="history"></div>
</div>

<div id="board"></div>

<div id="gameInfo">
    <div id="turn"></div>
    <button id="autoBtn">🤖 AI: TẮT</button>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>

let game = new Chess();

let board;

let peer;

let conn;

let myColor = null;

let autoAI = false;

let thinking = false;

const historyKey = "chess_history_rooms";

const pieceValues = {
    p:100,
    n:320,
    b:330,
    r:500,
    q:900,
    k:20000
};

function saveHistory(room){
    let list = JSON.parse(localStorage.getItem(historyKey)) || [];

    if(!list.includes(room)){
        list.unshift(room);
    }

    if(list.length > 5){
        list.pop();
    }

    localStorage.setItem(historyKey, JSON.stringify(list));

    renderHistory();
}

function renderHistory(){

    let history = JSON.parse(localStorage.getItem(historyKey)) || [];

    if(history.length === 0){
        $("#history").html("");
        return;
    }

    let html = "<h3>🕒 Phòng gần đây</h3>";

    history.forEach(room=>{
        html += `
        <div class="historyItem">
            <span>${room}</span>
            <button onclick="quickJoin('${room}')">Vào</button>
        </div>
        `;
    });

    $("#history").html(html);
}

function quickJoin(id){
    $("#roomInput").val(id);
    joinRoom(id);
}

function initBoard(){

    board = Chessboard("board",{

        draggable:true,

        position:"start",

        orientation:myColor,

        pieceTheme:
        "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png",

        onDragStart:onDragStart,

        onDrop:onDrop,

        onSnapEnd:()=>{
            board.position(game.fen());
        }

    });

}

function onDragStart(source,piece){

    if(game.game_over()) return false;

    if(
        (game.turn() === "w" && piece.search(/^b/) !== -1) ||
        (game.turn() === "b" && piece.search(/^w/) !== -1)
    ){
        return false;
    }

    if(
        (myColor === "white" && piece.search(/^b/) !== -1) ||
        (myColor === "black" && piece.search(/^w/) !== -1)
    ){
        return false;
    }

    if(autoAI){
        return false;
    }

}

function onDrop(source,target){

    removeGreySquares();

    let move = game.move({
        from:source,
        to:target,
        promotion:"q"
    });

    if(move === null){
        return "snapback";
    }

    syncBoard();

    if(conn && conn.open){

        conn.send({
            type:"sync",
            fen:game.fen()
        });

    }

    updateStatus();

    setTimeout(()=>{
        autoMove();
    },300);

}

function syncBoard(){
    board.position(game.fen());
}

function updateStatus(){

    let text = "";

    let myTurn =
        (myColor === "white" && game.turn() === "w") ||
        (myColor === "black" && game.turn() === "b");

    if(game.in_checkmate()){

        text = "♛ Chiếu bí";

    }else if(game.in_draw()){

        text = "🤝 Hòa";

    }else{

        text = myTurn ? "👉 Lượt của bạn" : "⏳ Đợi đối thủ";

        if(game.in_check()){
            text += " - CHIẾU!";
        }

    }

    $("#turn").text(text);

}

function evaluateBoard(boardState){

    let total = 0;

    boardState.board().forEach(row=>{

        row.forEach(piece=>{

            if(piece){

                let value = pieceValues[piece.type];

                total += piece.color === "w"
                ? value
                : -value;

            }

        });

    });

    return total;

}

function minimax(depth,gameState,alpha,beta,isMax){

    if(depth === 0){

        return evaluateBoard(gameState);

    }

    let moves = gameState.moves({verbose:true});

    if(isMax){

        let best = -999999;

        for(let move of moves){

            gameState.move(move);

            best = Math.max(
                best,
                minimax(depth-1,gameState,alpha,beta,false)
            );

            gameState.undo();

            alpha = Math.max(alpha,best);

            if(beta <= alpha){
                break;
            }

        }

        return best;

    }else{

        let best = 999999;

        for(let move of moves){

            gameState.move(move);

            best = Math.min(
                best,
                minimax(depth-1,gameState,alpha,beta,true)
            );

            gameState.undo();

            beta = Math.min(beta,best);

            if(beta <= alpha){
                break;
            }

        }

        return best;

    }

}

function getBestMove(){

    let moves = game.moves({verbose:true});

    let bestMove = null;

    let bestValue =
    game.turn() === "w"
    ? -999999
    : 999999;

    for(let move of moves){

        game.move(move);

        let value = minimax(
            2,
            game,
            -1000000,
            1000000,
            game.turn() === "b"
        );

        game.undo();

        if(game.turn() === "w"){

            if(value > bestValue){
                bestValue = value;
                bestMove = move;
            }

        }else{

            if(value < bestValue){
                bestValue = value;
                bestMove = move;
            }

        }

    }

    return bestMove;

}

function autoMove(){

    if(!autoAI) return;

    if(game.game_over()) return;

    if(thinking) return;

    let myTurn =
        (myColor === "white" && game.turn() === "w") ||
        (myColor === "black" && game.turn() === "b");

    if(!myTurn) return;

    thinking = true;

    setTimeout(()=>{

        let move = getBestMove();

        if(move){

            game.move(move);

            syncBoard();

            if(conn && conn.open){

                conn.send({
                    type:"sync",
                    fen:game.fen()
                });

            }

        }

        updateStatus();

        thinking = false;

    },300);

}

function createRoom(){

    let roomId =
    Math.floor(10000 + Math.random()*90000).toString();

    peer = new Peer(roomId);

    myColor = "white";

    peer.on("open",(id)=>{

        $("#status").html(
            `🎟️ Mã phòng: <b style="font-size:24px;color:#2ecc71">${id}</b>`
        );

        saveHistory(id);

    });

    peer.on("connection",(connection)=>{

        conn = connection;

        setupConnection();

        startGame();

    });

}

function joinRoom(id){

    peer = new Peer();

    myColor = "black";

    peer.on("open",()=>{

        conn = peer.connect(id);

        setupConnection();

    });

    saveHistory(id);

}

function setupConnection(){

    conn.on("open",()=>{

        $("#status").text("✅ Đã kết nối");

        startGame();

    });

    conn.on("data",(data)=>{

        if(data.type === "sync"){

            game.load(data.fen);

            syncBoard();

            updateStatus();

            setTimeout(()=>{
                autoMove();
            },300);

        }

    });

    conn.on("close",()=>{

        alert("Đối thủ đã thoát");

        location.reload();

    });

}

function startGame(){

    $("#menu").hide();

    $("#board").show();

    $("#gameInfo").show();

    if(!board){
        initBoard();
    }

    updateStatus();

    autoMove();

}

function removeGreySquares(){

    $("#board .square-55d63").css("background","");

}

$("#createBtn").click(()=>{
    createRoom();
});

$("#joinBtn").click(()=>{

    let room = $("#roomInput").val().trim();

    if(room){

        joinRoom(room);

    }

});

$("#autoBtn").click(function(){

    autoAI = !autoAI;

    if(autoAI){

        $(this)
        .addClass("active")
        .text("🤖 AI: BẬT");

        autoMove();

    }else{

        $(this)
        .removeClass("active")
        .text("🤖 AI: TẮT");

    }

});

renderHistory();

</script>

</body>
</html>
