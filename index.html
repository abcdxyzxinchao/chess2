<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cờ Tướng Online P2P</title>

<style>
body{
    margin:0;
    background:#1e1f22;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

#menu{
    width:95%;
    max-width:400px;
    background:#2b2d31;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

button{
    border:none;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
}

input{
    width:90%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    font-size:16px;
}

#createBtn{
    background:#2ecc71;
    color:white;
    width:100%;
}

#joinBtn{
    background:#3498db;
    color:white;
    width:100%;
}

#status{
    margin-top:15px;
    color:#f1c40f;
}

#board{
    margin-top:15px;
    display:none;
    position:relative;
}

.row{
    display:flex;
}

.cell{
    width:42px;
    height:42px;
    border:1px solid #d4a373;
    background:#f5deb3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
    user-select:none;
    position:relative;
}

.cell.selected{
    background:#f1c40f;
}

.cell.move{
    background:#2ecc71;
}

.red{
    color:#e74c3c;
    font-weight:bold;
}

.black{
    color:#111;
    font-weight:bold;
}

#gameInfo{
    display:none;
    text-align:center;
    margin-top:15px;
}

#turn{
    margin-bottom:10px;
    font-size:18px;
}

#autoBtn{
    background:#9b59b6;
    color:white;
}

#autoBtn.active{
    background:#2ecc71;
}
</style>
</head>

<body>

<div id="menu">
    <h2>♟️ Cờ Tướng Online</h2>

    <button id="createBtn">➕ Tạo phòng</button>

    <input id="roomInput" placeholder="Nhập mã phòng">

    <button id="joinBtn">🔗 Vào phòng</button>

    <div id="status">Chưa kết nối</div>
</div>

<div id="board"></div>

<div id="gameInfo">
    <div id="turn"></div>
    <button id="autoBtn">🤖 AI: TẮT</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>

const ROWS = 10;
const COLS = 9;

let peer;
let conn;

let mySide = null;

let autoAI = false;

let selected = null;

let board = [];

const PIECES = {
    r:"車",
    h:"馬",
    e:"象",
    a:"士",
    k:"將",
    c:"炮",
    p:"卒",

    R:"車",
    H:"馬",
    E:"相",
    A:"仕",
    K:"帥",
    C:"炮",
    P:"兵"
};

function initBoard(){

board = [

["r","h","e","a","k","a","e","h","r"],
["","","","","","","","",""],
["","c","","","","","","c",""],
["p","","p","","p","","p","","p"],
["","","","","","","","",""],

["","","","","","","","",""],

["P","","P","","P","","P","","P"],
["","C","","","","","","C",""],
["","","","","","","","",""],
["R","H","E","A","K","A","E","H","R"]

];

}

function renderBoard(){

const boardDiv = document.getElementById("board");

boardDiv.innerHTML = "";

for(let r=0;r<ROWS;r++){

    const rowDiv = document.createElement("div");
    rowDiv.className = "row";

    for(let c=0;c<COLS;c++){

        const cell = document.createElement("div");

        cell.className = "cell";

        cell.dataset.row = r;
        cell.dataset.col = c;

        const piece = board[r][c];

        if(piece){

            cell.innerHTML = PIECES[piece];

            if(piece === piece.toUpperCase()){
                cell.classList.add("red");
            }else{
                cell.classList.add("black");
            }

        }

        cell.onclick = ()=>handleClick(r,c);

        rowDiv.appendChild(cell);

    }

    boardDiv.appendChild(rowDiv);

}

}

function isRed(piece){
    return piece && piece === piece.toUpperCase();
}

function currentTurn(){

    return turn;
}

let turn = "red";

function handleClick(r,c){

if(!isMyTurn()) return;

const piece = board[r][c];

if(selected){

    const move = isValidMove(selected.r,selected.c,r,c);

    if(move){

        movePiece(selected.r,selected.c,r,c);

        selected = null;

        renderBoard();

        syncGame();

        switchTurn();

        aiMove();

        return;
    }

}

if(piece){

    if(turn === "red" && isRed(piece)){
        selected = {r,c};
    }

    if(turn === "black" && !isRed(piece)){
        selected = {r,c};
    }

}

renderBoard();

if(selected){

    const index =
    selected.r * COLS + selected.c;

    document.querySelectorAll(".cell")[index]
    .classList.add("selected");

}

}

function movePiece(sr,sc,tr,tc){

board[tr][tc] = board[sr][sc];

board[sr][sc] = "";

}

function switchTurn(){

turn = turn === "red"
? "black"
: "red";

updateStatus();

}

function isMyTurn(){

return (
(mySide === "red" && turn === "red") ||
(mySide === "black" && turn === "black")
);

}

function updateStatus(){

document.getElementById("turn").innerHTML =
isMyTurn()
? "👉 Lượt của bạn"
: "⏳ Đợi đối thủ";

}

function isInside(r,c){

return r >=0 && r < ROWS &&
c >=0 && c < COLS;

}

function isValidMove(sr,sc,tr,tc){

if(!isInside(tr,tc)) return false;

const piece = board[sr][sc];

const target = board[tr][tc];

if(target){

if(isRed(piece) === isRed(target)){
    return false;
}

}

const dr = tr - sr;
const dc = tc - sc;

switch(piece.toLowerCase()){

case "r":

if(sr !== tr && sc !== tc)
return false;

if(sr === tr){

let step = dc > 0 ? 1 : -1;

for(let c=sc+step;c!==tc;c+=step){

if(board[sr][c] !== "")
return false;

}

}else{

let step = dr > 0 ? 1 : -1;

for(let r=sr+step;r!==tr;r+=step){

if(board[r][sc] !== "")
return false;

}

}

return true;

case "h":

if(
(Math.abs(dr)===2 && Math.abs(dc)===1) ||
(Math.abs(dr)===1 && Math.abs(dc)===2)
){
return true;
}

return false;

case "k":

if(Math.abs(dr)+Math.abs(dc)!==1)
return false;

if(isRed(piece)){

return tr >=7 && tc>=3 && tc<=5;

}else{

return tr <=2 && tc>=3 && tc<=5;

}

case "p":

if(isRed(piece)){

if(sr <=4){

if(
(dr===-1 && dc===0) ||
(dr===0 && Math.abs(dc)===1)
) return true;

}else{

if(dr===-1 && dc===0)
return true;

}

}else{

if(sr >=5){

if(
(dr===1 && dc===0) ||
(dr===0 && Math.abs(dc)===1)
) return true;

}else{

if(dr===1 && dc===0)
return true;

}

}

return false;

case "c":

if(sr !== tr && sc !== tc)
return false;

let count = 0;

if(sr === tr){

let step = dc > 0 ? 1 : -1;

for(let c=sc+step;c!==tc;c+=step){

if(board[sr][c] !== "")
count++;

}

}else{

let step = dr > 0 ? 1 : -1;

for(let r=sr+step;r!==tr;r+=step){

if(board[r][sc] !== "")
count++;

}

}

if(target === ""){

return count === 0;

}else{

return count === 1;

}

case "a":

if(Math.abs(dr)!==1 || Math.abs(dc)!==1)
return false;

if(isRed(piece)){

return tr >=7 && tc>=3 && tc<=5;

}else{

return tr <=2 && tc>=3 && tc<=5;

}

case "e":

if(Math.abs(dr)!==2 || Math.abs(dc)!==2)
return false;

if(isRed(piece) && tr <5)
return false;

if(!isRed(piece) && tr >4)
return false;

return true;

}

return false;

}

function syncGame(){

if(conn && conn.open){

conn.send({
type:"sync",
board,
turn
});

}

}

function randomMove(){

let moves = [];

for(let r=0;r<ROWS;r++){

for(let c=0;c<COLS;c++){

const piece = board[r][c];

if(!piece) continue;

if(turn==="red" && !isRed(piece))
continue;

if(turn==="black" && isRed(piece))
continue;

for(let tr=0;tr<ROWS;tr++){

for(let tc=0;tc<COLS;tc++){

if(isValidMove(r,c,tr,tc)){

moves.push({
sr:r,
sc:c,
tr,
tc
});

}

}

}

}

}

if(moves.length===0)
return null;

return moves[
Math.floor(Math.random()*moves.length)
];

}

function aiMove(){

if(!autoAI) return;

if(!isMyTurn()) return;

setTimeout(()=>{

const move = randomMove();

if(move){

movePiece(
move.sr,
move.sc,
move.tr,
move.tc
);

renderBoard();

syncGame();

switchTurn();

}

},500);

}

function createRoom(){

const id =
Math.floor(10000+Math.random()*90000).toString();

peer = new Peer(id);

mySide = "red";

peer.on("open",(id)=>{

document.getElementById("status")
.innerHTML =
`🎟️ Mã phòng:
<b style="font-size:24px;color:#2ecc71">${id}</b>`;

});

peer.on("connection",(connection)=>{

conn = connection;

setupConnection();

startGame();

});

}

function joinRoom(id){

peer = new Peer();

mySide = "black";

peer.on("open",()=>{

conn = peer.connect(id);

setupConnection();

});

}

function setupConnection(){

conn.on("open",()=>{

document.getElementById("status")
.innerHTML = "✅ Đã kết nối";

startGame();

});

conn.on("data",(data)=>{

board = data.board;

turn = data.turn;

renderBoard();

updateStatus();

aiMove();

});

conn.on("close",()=>{

alert("Đối thủ thoát");

location.reload();

});

}

function startGame(){

document.getElementById("menu")
.style.display = "none";

document.getElementById("board")
.style.display = "block";

document.getElementById("gameInfo")
.style.display = "block";

renderBoard();

updateStatus();

aiMove();

}

document.getElementById("createBtn")
.onclick = ()=>createRoom();

document.getElementById("joinBtn")
.onclick = ()=>{

const id =
document.getElementById("roomInput")
.value.trim();

if(id){

joinRoom(id);

}

};

document.getElementById("autoBtn")
.onclick = function(){

autoAI = !autoAI;

if(autoAI){

this.classList.add("active");

this.innerHTML = "🤖 AI: BẬT";

aiMove();

}else{

this.classList.remove("active");

this.innerHTML = "🤖 AI: TẮT";

}

};

initBoard();

</script>

</body>
</html>
