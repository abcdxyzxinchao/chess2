<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cờ Tướng Online AI</title>

<style>
body{
    margin:0;
    background:#1f2125;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

#menu{
    width:95%;
    max-width:420px;
    background:#2b2d31;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

input{
    width:90%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    font-size:16px;
}

button{
    border:none;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
}

#createBtn{
    width:100%;
    background:#2ecc71;
    color:white;
}

#joinBtn{
    width:100%;
    background:#3498db;
    color:white;
}

#status{
    margin-top:15px;
    color:#f1c40f;
}

#board{
    display:none;
    margin-top:10px;
}

.row{
    display:flex;
}

.cell{
    width:44px;
    height:44px;
    background:#f5deb3;
    border:1px solid #8b5a2b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.cell.selected{
    background:#f1c40f;
}

.red{
    color:#e74c3c;
}

.black{
    color:#111;
}

#gameInfo{
    display:none;
    margin-top:15px;
    text-align:center;
}

#turn{
    font-size:18px;
    margin-bottom:10px;
}

#autoBtn{
    background:#9b59b6;
    color:white;
}

#autoBtn.active{
    background:#2ecc71;
}
</style>
</head>

<body>

<div id="menu">

<h2>♟️ Cờ Tướng Online</h2>

<button id="createBtn">➕ Tạo phòng</button>

<input id="roomInput" placeholder="Nhập mã phòng">

<button id="joinBtn">🔗 Vào phòng</button>

<div id="status">Chưa kết nối</div>

</div>

<div id="board"></div>

<div id="gameInfo">

<div id="turn"></div>

<button id="autoBtn">🤖 AI: TẮT</button>

</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>

const ROWS = 10;
const COLS = 9;

let peer;
let conn;

let mySide = null;

let autoAI = false;

let selected = null;

let turn = "red";

let board = [];

const pieces = {

r:"車",
h:"馬",
e:"象",
a:"士",
k:"將",
c:"炮",
p:"卒",

R:"車",
H:"馬",
E:"相",
A:"仕",
K:"帥",
C:"炮",
P:"兵"

};

function initBoard(){

board = [

["r","h","e","a","k","a","e","h","r"],
["","","","","","","","",""],
["","c","","","","","","c",""],
["p","","p","","p","","p","","p"],
["","","","","","","","",""],

["","","","","","","","",""],

["P","","P","","P","","P","","P"],
["","C","","","","","","C",""],
["","","","","","","","",""],
["R","H","E","A","K","A","E","H","R"]

];

}

function renderBoard(){

const boardDiv = document.getElementById("board");

boardDiv.innerHTML = "";

for(let r=0;r<ROWS;r++){

const row = document.createElement("div");

row.className = "row";

for(let c=0;c<COLS;c++){

const cell = document.createElement("div");

cell.className = "cell";

cell.dataset.r = r;
cell.dataset.c = c;

const piece = board[r][c];

if(piece){

cell.innerHTML = pieces[piece];

if(piece === piece.toUpperCase()){

cell.classList.add("red");

}else{

cell.classList.add("black");

}

}

cell.onclick = ()=>clickCell(r,c);

row.appendChild(cell);

}

boardDiv.appendChild(row);

}

if(selected){

const index = selected.r * COLS + selected.c;

document.querySelectorAll(".cell")[index]
.classList.add("selected");

}

}

function isRed(piece){

return piece &&
piece === piece.toUpperCase();

}

function isMyTurn(){

return (
(mySide === "red" && turn === "red") ||
(mySide === "black" && turn === "black")
);

}

function updateTurn(){

document.getElementById("turn")
.innerHTML =
isMyTurn()
? "👉 Lượt của bạn"
: "⏳ Đợi đối thủ";

}

function clickCell(r,c){

if(!isMyTurn()) return;

const piece = board[r][c];

if(selected){

if(isValidMove(selected.r,selected.c,r,c)){

movePiece(selected.r,selected.c,r,c);

selected = null;

renderBoard();

syncGame();

switchTurn();

checkWinner();

setTimeout(()=>{
aiMove();
},200);

return;

}else{

selected = null;

}

}

if(piece){

if(turn === "red" && isRed(piece)){

selected = {r,c};

}

if(turn === "black" && !isRed(piece)){

selected = {r,c};

}

}

renderBoard();

}

function movePiece(sr,sc,tr,tc){

board[tr][tc] = board[sr][sc];

board[sr][sc] = "";

}

function switchTurn(){

turn =
turn === "red"
? "black"
: "red";

updateTurn();

}

function isInside(r,c){

return r>=0 && r<ROWS &&
c>=0 && c<COLS;

}

function isValidMove(sr,sc,tr,tc){

if(!isInside(tr,tc))
return false;

const piece = board[sr][sc];

const target = board[tr][tc];

if(target){

if(isRed(piece) === isRed(target))
return false;

}

const dr = tr - sr;
const dc = tc - sc;

switch(piece.toLowerCase()){

case "r":

if(sr !== tr && sc !== tc)
return false;

if(sr === tr){

let step = dc>0 ? 1 : -1;

for(let c=sc+step;c!==tc;c+=step){

if(board[sr][c] !== "")
return false;

}

}else{

let step = dr>0 ? 1 : -1;

for(let r=sr+step;r!==tr;r+=step){

if(board[r][sc] !== "")
return false;

}

}

return true;

case "h":

if(
(Math.abs(dr)===2 && Math.abs(dc)===1) ||
(Math.abs(dr)===1 && Math.abs(dc)===2)
){

return true;

}

return false;

case "k":

if(Math.abs(dr)+Math.abs(dc)!==1)
return false;

if(isRed(piece)){

return tr>=7 && tc>=3 && tc<=5;

}else{

return tr<=2 && tc>=3 && tc<=5;

}

case "a":

if(Math.abs(dr)!==1 ||
Math.abs(dc)!==1)
return false;

if(isRed(piece)){

return tr>=7 && tc>=3 && tc<=5;

}else{

return tr<=2 && tc>=3 && tc<=5;

}

case "e":

if(Math.abs(dr)!==2 ||
Math.abs(dc)!==2)
return false;

if(isRed(piece) && tr<5)
return false;

if(!isRed(piece) && tr>4)
return false;

return true;

case "p":

if(isRed(piece)){

if(sr<=4){

if(
(dr===-1 && dc===0) ||
(dr===0 && Math.abs(dc)===1)
)
return true;

}else{

if(dr===-1 && dc===0)
return true;

}

}else{

if(sr>=5){

if(
(dr===1 && dc===0) ||
(dr===0 && Math.abs(dc)===1)
)
return true;

}else{

if(dr===1 && dc===0)
return true;

}

}

return false;

case "c":

if(sr !== tr && sc !== tc)
return false;

let count = 0;

if(sr === tr){

let step = dc>0 ? 1 : -1;

for(let c=sc+step;c!==tc;c+=step){

if(board[sr][c] !== "")
count++;

}

}else{

let step = dr>0 ? 1 : -1;

for(let r=sr+step;r!==tr;r+=step){

if(board[r][sc] !== "")
count++;

}

}

if(target === ""){

return count===0;

}else{

return count===1;

}

}

return false;

}

function syncGame(){

if(conn && conn.open){

conn.send({
board,
turn
});

}

}

function evaluateBoard(){

const values = {

k:10000,
r:900,
c:500,
h:400,
e:200,
a:200,
p:100

};

let score = 0;

for(let r=0;r<ROWS;r++){

for(let c=0;c<COLS;c++){

const piece = board[r][c];

if(piece){

const value =
values[piece.toLowerCase()] || 0;

if(isRed(piece)){

score += value;

}else{

score -= value;

}

}

}

}

return turn==="red"
? score
: -score;

}

function getAllMoves(side){

let moves = [];

for(let r=0;r<ROWS;r++){

for(let c=0;c<COLS;c++){

const piece = board[r][c];

if(!piece) continue;

if(side==="red" && !isRed(piece))
continue;

if(side==="black" && isRed(piece))
continue;

for(let tr=0;tr<ROWS;tr++){

for(let tc=0;tc<COLS;tc++){

if(isValidMove(r,c,tr,tc)){

moves.push({
sr:r,
sc:c,
tr,
tc
});

}

}

}

}

}

return moves;

}

function aiMove(){

if(!autoAI) return;

if(!isMyTurn()) return;

let bestScore = -999999;

let bestMove = null;

const moves = getAllMoves(turn);

for(let move of moves){

const backup = board[move.tr][move.tc];

board[move.tr][move.tc] =
board[move.sr][move.sc];

board[move.sr][move.sc] = "";

let score = evaluateBoard();

board[move.sr][move.sc] =
board[move.tr][move.tc];

board[move.tr][move.tc] = backup;

if(score > bestScore){

bestScore = score;

bestMove = move;

}

}

if(bestMove){

setTimeout(()=>{

movePiece(
bestMove.sr,
bestMove.sc,
bestMove.tr,
bestMove.tc
);

renderBoard();

syncGame();

switchTurn();

checkWinner();

},500);

}

}

function checkWinner(){

let redKing = false;
let blackKing = false;

for(let r=0;r<ROWS;r++){

for(let c=0;c<COLS;c++){

if(board[r][c] === "K")
redKing = true;

if(board[r][c] === "k")
blackKing = true;

}

}

if(!redKing){

alert("⚫ Đen thắng");

location.reload();

}

if(!blackKing){

alert("🔴 Đỏ thắng");

location.reload();

}

}

function createRoom(){

const roomId =
Math.floor(
10000 + Math.random()*90000
).toString();

peer = new Peer(roomId);

mySide = "red";

peer.on("open",(id)=>{

document.getElementById("status")
.innerHTML =
`🎟️ Mã phòng:
<b style="font-size:24px;color:#2ecc71">
${id}
</b>`;

});

peer.on("connection",(connection)=>{

conn = connection;

setupConnection();

startGame();

});

}

function joinRoom(id){

peer = new Peer();

mySide = "black";

peer.on("open",()=>{

conn = peer.connect(id);

setupConnection();

});

}

function setupConnection(){

conn.on("open",()=>{

document.getElementById("status")
.innerHTML = "✅ Đã kết nối";

startGame();

});

conn.on("data",(data)=>{

board = data.board;

turn = data.turn;

renderBoard();

updateTurn();

setTimeout(()=>{
aiMove();
},200);

});

conn.on("close",()=>{

alert("Đối thủ thoát");

location.reload();

});

}

function startGame(){

document.getElementById("menu")
.style.display = "none";

document.getElementById("board")
.style.display = "block";

document.getElementById("gameInfo")
.style.display = "block";

renderBoard();

updateTurn();

setTimeout(()=>{
aiMove();
},300);

}

document.getElementById("createBtn")
.onclick = ()=>createRoom();

document.getElementById("joinBtn")
.onclick = ()=>{

const id =
document.getElementById("roomInput")
.value.trim();

if(id){

joinRoom(id);

}

};

document.getElementById("autoBtn")
.onclick = function(){

autoAI = !autoAI;

if(autoAI){

this.classList.add("active");

this.innerHTML = "🤖 AI: BẬT";

setTimeout(()=>{
aiMove();
},300);

}else{

this.classList.remove("active");

this.innerHTML = "🤖 AI: TẮT";

}

};

initBoard();

</script>

</body>
</html>
